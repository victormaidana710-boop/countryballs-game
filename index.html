<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COUNTRYBALLS WAR ONLINE - VM</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b132b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  /* PANTALLA INTRO VM STUDIOS */
  #introScreen {
    position: absolute; inset: 0; z-index: 9999; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; transition: opacity 0.8s;
  }
  .intro-logo { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #ff0055, #ffcc00, #00ffcc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255,0,85,0.4); }
  .intro-sub { font-size: 1.2rem; color: #888; letter-spacing: 6px; margin-top: 5px; }
  .intro-hint { margin-top: 40px; font-size: 0.9rem; color: #555; animation: blink 1.5s infinite; }

  @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* LOBBY INTERFAZ SLITHER.IO CON FONDO AZUL */
  #lobbyScreen {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle, #1d3557 0%, #0b132b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .slither-title {
    font-size: 3rem; font-weight: 900; color: #fff;
    text-shadow: 0 5px 0 #000, 0 0 20px rgba(255,255,255,0.3);
    letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase;
  }

  .avatar-container {
    position: relative; width: 150px; height: 150px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
  }

  .avatar-preview {
    width: 140px; height: 140px; border-radius: 50%;
    border: 5px solid #000; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    background-size: cover; background-position: center; position: relative;
  }

  .input-nick {
    width: 260px; padding: 12px; border-radius: 25px; border: 3px solid #4cc9f0;
    background: rgba(0,0,0,0.6); color: #fff; text-align: center;
    font-size: 1.2rem; font-weight: bold; outline: none; margin-bottom: 15px;
  }

  .btn-play {
    width: 240px; padding: 14px; border-radius: 30px; border: none;
    background: linear-gradient(135deg, #2ec4b6, #0f9f90);
    color: #fff; font-size: 1.3rem; font-weight: 900; cursor: pointer;
    box-shadow: 0 6px 0 #0a665c, 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s; margin-bottom: 12px;
  }
  .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a665c; }

  .btn-skin {
    padding: 10px 24px; border-radius: 20px; border: 2px solid #fff;
    background: rgba(255,255,255,0.15); color: #fff; font-weight: bold; cursor: pointer;
  }

  /* CANVAS DEL JUEGO */
  #gameCanvas { width: 100%; height: 100%; display: block; background: #0b132b; }
</style>
</head>
<body>

  <!-- INTRO VM STUDIOS -->
  <div id="introScreen" onclick="startApp()">
    <div class="intro-logo">VM</div>
    <div class="intro-sub">STUDIOS</div>
    <div class="intro-hint">Toca la pantalla para continuar</div>
  </div>

  <!-- LOBBY PRINCIPAL ESTILO SLITHER -->
  <div id="lobbyScreen" style="display: none;">
    <div class="slither-title">Countryballs War</div>
    
    <div class="avatar-container">
      <div id="avatarPreview" class="avatar-preview"></div>
    </div>
    
    <input type="text" id="nickInput" class="input-nick" value="Player 1" maxlength="12">
    
    <button class="btn-play" onclick="enterGame()">PLAY GAME</button>
    <button class="btn-skin" onclick="nextSkin()">Cambiar Ball</button>
  </div>

  <!-- CANVAS JUEGO -->
  <canvas id="gameCanvas"></canvas>

<script>
  // AUDIO
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playClick() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 450;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } catch(e){}
  }

  // INTRO LOGIC
  function startApp() {
    playClick();
    const intro = document.getElementById('introScreen');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'flex';
    }, 800);
  }

  // BANDERAS DE LAS IMÁGENES (COUNTRYBALLS)
  const skins = [
    { name: 'Portugal', flag: 'https://flagcdn.com/w320/pt.png' },
    { name: 'Brasil', flag: 'https://flagcdn.com/w320/br.png' },
    { name: 'Argentina', flag: 'https://flagcdn.com/w320/ar.png' },
    { name: 'Uruguay', flag: 'https://flagcdn.com/w320/uy.png' },
    { name: 'Chile', flag: 'https://flagcdn.com/w320/cl.png' },
    { name: 'Colombia', flag: 'https://flagcdn.com/w320/co.png' },
    { name: 'México', flag: 'https://flagcdn.com/w320/mx.png' },
    { name: 'USA', flag: 'https://flagcdn.com/w320/us.png' },
    { name: 'España', flag: 'https://flagcdn.com/w320/es.png' },
    { name: 'Canadá', flag: 'https://flagcdn.com/w320/ca.png' }
  ];
  let skinIdx = 0;

  const avatarPreview = document.getElementById('avatarPreview');
  function updateAvatar() {
    avatarPreview.style.backgroundImage = `url(${skins[skinIdx].flag})`;
  }
  function nextSkin() {
    playClick();
    skinIdx = (skinIdx + 1) % skins.length;
    updateAvatar();
  }
  updateAvatar();

  // MOTOR DE JUEGO (SLITHER STYLE PERO SOLO CON BALLS Y OJOS)
  let canvas, ctx;
  let inGame = false;
  let player = { x: 0, y: 0, radius: 35, vx: 0, vy: 0, img: new Image(), angle: 0 };
  let mouse = { x: 0, y: 0 };
  let foodList = [];
  let botBalls = [];

  // CARGA DE IMÁGENES
  const loadedImages = {};
  skins.forEach(s => {
    const img = new Image();
    img.src = s.flag;
    loadedImages[s.name] = img;
  });

  function enterGame() {
    playClick();
    document.getElementById('lobbyScreen').style.display = 'none';
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    player.img = loadedImages[skins[skinIdx].name];
    player.x = 0;
    player.y = 0;
    mouse.x = canvas.width / 2;
    mouse.y = canvas.height / 2;

    // Generar comida brillante
    foodList = [];
    for(let i = 0; i < 150; i++) {
      foodList.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        r: 5 + Math.random() * 5,
        color: `hsl(${Math.random()*360}, 90%, 65%)`
      });
    }

    // Generar otras Countryballs enemigas (Bots) en vez de gusanos
    botBalls = [];
    for(let i = 0; i < 15; i++) {
      let randomSkin = skins[Math.floor(Math.random() * skins.length)];
      botBalls.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        radius: 30 + Math.random() * 15,
        img: loadedImages[randomSkin.name],
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        angle: 0
      });
    }

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', e => {
      if(e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, {passive: true});

    inGame = true;
    requestAnimationFrame(loop);
  }

  // DIBUJAR OJOS CLÁSICOS COUNTRYBALLS EN CUALQUIER BOLA
  function drawCountryball(x, y, radius, img, angle) {
    ctx.save();
    ctx.translate(x, y);

    // Dibuja la pelota con la bandera
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.clip();
    if(img.complete) {
      ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2);
    } else {
      ctx.fillStyle = '#333'; ctx.fill();
    }
    ctx.restore();

    // Borde grueso estilo cómic
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Dibuja los ojos blancos mirando hacia la dirección del movimiento
    let eyeOffsetX = Math.cos(angle) * (radius * 0.3);
    let eyeOffsetY = Math.sin(angle) * (radius * 0.3);

    // Ojo Izquierdo
    ctx.beginPath();
    ctx.ellipse(eyeOffsetX - radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

    // Ojo Derecho
    ctx.beginPath();
    ctx.ellipse(eyeOffsetX + radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

    ctx.restore();
  }

  function loop() {
    if(!inGame) return;

    // Dirección del jugador hacia el puntero
    let dx = mouse.x - canvas.width / 2;
    let dy = mouse.y - canvas.height / 2;
    player.angle = Math.atan2(dy, dx);
    
    let dist = Math.hypot(dx, dy);
    if (dist > 10) {
      player.x += Math.cos(player.angle) * 4;
      player.y += Math.sin(player.angle) * 4;
    }

    // Mover bots (Countryballs enemigas)
    botBalls.forEach(bot => {
      bot.x += bot.vx;
      bot.y += bot.vy;
      bot.angle = Math.atan2(bot.vy, bot.vx);

      // Rebotar en bordes distantes
      if(Math.abs(bot.x) > 1800) bot.vx *= -1;
      if(Math.abs(bot.y) > 1800) bot.vy *= -1;
    });

    // RENDERIZADO (CÁMARA CENTRADA EN EL JUGADOR)
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo Cuadrícula / Malla Slither
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    let gridOffsetX = (-player.x + canvas.width/2) % 60;
    let gridOffsetY = (-player.y + canvas.height/2) % 60;
    
    for (let x = gridOffsetX; x < canvas.width; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = gridOffsetY; y < canvas.height; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Render Comida
    foodList.forEach(f => {
      let screenX = f.x - player.x + canvas.width/2;
      let screenY = f.y - player.y + canvas.height/2;
      ctx.beginPath();
      ctx.arc(screenX, screenY, f.r, 0, Math.PI*2);
      ctx.fillStyle = f.color;
      ctx.fill();
    });

    // Render Countryballs Enemigas (Bots)
    botBalls.forEach(bot => {
      let screenX = bot.x - player.x + canvas.width/2;
      let screenY = bot.y - player.y + canvas.height/2;
      drawCountryball(screenX, screenY, bot.radius, bot.img, bot.angle);
    });

    // Render Jugador Principal
    drawCountryball(canvas.width/2, canvas.height/2, player.radius, player.img, player.angle);

    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
