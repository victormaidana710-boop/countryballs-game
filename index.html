<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            background: #2b7a0b;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

    <div id="hud">Eliminaciones: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 25,
        color: "#ffcc00",
        speed: 4
    };

    let structures = [
        { x: 100, y: 150, width: 90, height: 40 },
        { x: 300, y: 400, width: 110, height: 50 },
        { x: 200, y: 250, width: 60, height: 70 }
    ];

    let bots = [
        { x: 80, y: 80, radius: 25, color: "#e74c3c", alive: true },
        { x: canvas.width - 100, y: 120, radius: 25, color: "#3498db", alive: true },
        { x: canvas.width - 150, y: canvas.height - 150, radius: 25, color: "#9b59b6", alive: true }
    ];

    let bullets = [];
    let score = 0;
    let touchX = player.x;
    let touchY = player.y;
    let isTouching = false;

    window.addEventListener("pointerdown", (e) => {
        isTouching = true;
        touchX = e.clientX;
        touchY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
        if (isTouching) {
            touchX = e.clientX;
            touchY = e.clientY;
        }
    });

    window.addEventListener("pointerup", () => {
        isTouching = false;
    });

    // Disparo automático al enemigo más cercano
    setInterval(() => {
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        if (closestBot && minDist < 400) {
            let angle = Math.atan2(closestBot.y - player.y, closestBot.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 8,
                dy: Math.sin(angle) * 8,
                radius: 6
            });
        }
    }, 500);

    function update() {
        if (isTouching) {
            let angle = Math.atan2(touchY - player.y, touchX - player.x);
            let nextX = player.x + Math.cos(angle) * player.speed;
            let nextY = player.y + Math.sin(angle) * player.speed;

            let collide = false;
            structures.forEach(s => {
                if (nextX > s.x && nextX < s.x + s.width && nextY > s.y && nextY < s.y + s.height) {
                    collide = true;
                }
            });

            if (!collide) {
                player.x = nextX;
                player.y = nextY;
            }
        }

        bullets.forEach((b, index) => {
            b.x += b.dx;
            b.y += b.dy;

            bots.forEach(bot => {
                if (bot.alive && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius + b.radius) {
                    bot.alive = false;
                    score += 1;
                    document.getElementById("score").innerText = score;
                    bullets.splice(index, 1);
                }
            });
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar estructuras para esconderse
        ctx.fillStyle = "#7f8c8d";
        structures.forEach(s => {
            ctx.fillRect(s.x, s.y, s.width, s.height);
            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 3;
            ctx.strokeRect(s.x, s.y, s.width, s.height);
        });

        // Dibujar bots
        bots.forEach(bot => {
            if (bot.alive) {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000";
                ctx.stroke();
                ctx.closePath();
            }
        });

        // Dibujar jugador
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();

        // Dibujar balas
        ctx.fillStyle = "#ffffff";
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
