<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola - Battle Royale</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
            color: white;
        }
        /* Pantallas de Menú y Lobby */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 32px;
            color: #ffcc00;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 4px #c0392b;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c0392b;
        }
        .skins-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .skin-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        .skin-option.selected {
            border-color: #ffcc00;
            transform: scale(1.1);
        }
        /* Lienzo del juego */
        canvas {
            display: block;
            background: #2b7a0b;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- LOBBY / SELECCIÓN DE SKINS -->
    <div id="lobbyScreen" class="screen">
        <h1>LIGA BOLA: BATTLE ROYALE</h1>
        <p>Elige tu Skin de Countryball:</p>
        
        <div class="skins-container">
            <div class="skin-option selected" style="background: #ffcc00;" onclick="selectSkin('#ffcc00', 'Argentina')">Arg</div>
            <div class="skin-option" style="background: #3498db;" onclick="selectSkin('#3498db', 'EEUU')">USA</div>
            <div class="skin-option" style="background: #e74c3c;" onclick="selectSkin('#e74c3c', 'Alemania')">Ale</div>
        </div>

        <p>Dificultad de los Bots:</p>
        <div>
            <button class="btn" onclick="startGame('facil')">Fácil</button>
            <button class="btn" onclick="startGame('dificil')">Difícil</button>
        </div>
    </div>

    <!-- HUD DURANTE LA PARTIDA -->
    <div id="hud" class="hidden">Eliminaciones: <span id="score">0</span></div>
    <canvas id="gameCanvas" class="hidden"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let playerColor = "#ffcc00";
    let botSpeed = 2;
    let score = 0;
    let gameRunning = false;

    let player = { x: 0, y: 0, radius: 25, speed: 4 };
    let structures = [];
    let bots = [];
    let bullets = [];
    let touchX = 0, touchY = 0, isTouching = false;

    function selectSkin(color, name) {
        playerColor = color;
        document.querySelectorAll('.skin-option').forEach(el => el.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function startGame(difficulty) {
        botSpeed = (difficulty === 'dificil') ? 3.5 : 1.8;

        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("hud").classList.remove("hidden");
        canvas.classList.remove("hidden");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        touchX = player.x;
        touchY = player.y;

        // Crear estructuras (coberturas)
        structures = [
            { x: canvas.width * 0.2, y: canvas.height * 0.3, width: 90, height: 40 },
            { x: canvas.width * 0.6, y: canvas.height * 0.5, width: 110, height: 50 },
            { x: canvas.width * 0.4, y: canvas.height * 0.7, width: 70, height: 70 }
        ];

        // Crear Bots enemigos
        bots = [
            { x: 100, y: 100, radius: 25, color: "#e74c3c", alive: true },
            { x: canvas.width - 100, y: 150, radius: 25, color: "#3498db", alive: true },
            { x: canvas.width - 150, y: canvas.height - 100, radius: 25, color: "#9b59b6", alive: true }
        ];

        gameRunning = true;
        loop();
    }

    window.addEventListener("pointerdown", (e) => { isTouching = true; touchX = e.clientX; touchY = e.clientY; });
    window.addEventListener("pointermove", (e) => { if (isTouching) { touchX = e.clientX; touchY = e.clientY; } });
    window.addEventListener("pointerup", () => { isTouching = false; });

    // Disparo automático al enemigo más cercano
    setInterval(() => {
        if (!gameRunning) return;
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        if (closestBot && minDist < 450) {
            let angle = Math.atan2(closestBot.y - player.y, closestBot.x - player.x);
            bullets.push({
                x: player.x, y: player.y,
                dx: Math.cos(angle) * 8, dy: Math.sin(angle) * 8,
                radius: 6, isPlayer: true
            });
        }
    }, 500);

    function update() {
        if (!gameRunning) return;

        // Movimiento del jugador táctico
        if (isTouching) {
            let angle = Math.atan2(touchY - player.y, touchX - player.x);
            let nextX = player.x + Math.cos(angle) * player.speed;
            let nextY = player.y + Math.sin(angle) * player.speed;

            let collide = false;
            structures.forEach(s => {
                if (nextX > s.x && nextX < s.x + s.width && nextY > s.y && nextY < s.y + s.height) {
                    collide = true;
                }
            });

            if (!collide) {
                player.x = nextX;
                player.y = nextY;
            }
        }

        // Movimiento simple de los Bots hacia el jugador
        bots.forEach(bot => {
            if (bot.alive) {
                let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                bot.x += Math.cos(angle) * botSpeed;
                bot.y += Math.sin(angle) * botSpeed;
            }
        });

        // Actualizar balas
        bullets.forEach((b, index) => {
            b.x += b.dx;
            b.y += b.dy;

            bots.forEach(bot => {
                if (bot.alive && b.isPlayer && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius + b.radius) {
                    bot.alive = false;
                    score += 1;
                    document.getElementById("score").innerText = score;
                    bullets.splice(index, 1);
                }
            });
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Estructuras de cobertura
        ctx.fillStyle = "#7f8c8d";
        structures.forEach(s => {
            ctx.fillRect(s.x, s.y, s.width, s.height);
            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 3;
            ctx.strokeRect(s.x, s.y, s.width, s.height);
        });

        // Bots
        bots.forEach(bot => {
            if (bot.alive) {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000";
                ctx.stroke();
                ctx.closePath();
            }
        });

        // Jugador con la skin elegida
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();

        // Balas
        ctx.fillStyle = "#ffffff";
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
        });
    }

    function loop() {
        if (gameRunning) {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    }
</script>

</body>
</html>
