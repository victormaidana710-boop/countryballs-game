<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COUNTRYBALLS WAR ONLINE - VM</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b132b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  /* INTRO VM STUDIOS */
  #introScreen {
    position: absolute; inset: 0; z-index: 9999; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; transition: opacity 0.8s;
  }
  .intro-logo { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #ff0055, #ffcc00, #00ffcc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255,0,85,0.4); }
  .intro-sub { font-size: 1.2rem; color: #888; letter-spacing: 6px; margin-top: 5px; }
  .intro-hint { margin-top: 40px; font-size: 0.9rem; color: #555; animation: blink 1.5s infinite; }

  @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* LOBBY SLITHER */
  #lobbyScreen {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle, #1d3557 0%, #0b132b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .slither-title {
    font-size: 3rem; font-weight: 900; color: #fff;
    text-shadow: 0 5px 0 #000, 0 0 20px rgba(255,255,255,0.3);
    letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase;
  }

  .avatar-container {
    position: relative; width: 150px; height: 150px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
  }

  .avatar-preview {
    width: 140px; height: 140px; border-radius: 50%;
    border: 5px solid #000; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    background-size: cover; background-position: center; position: relative;
  }

  .input-nick {
    width: 260px; padding: 12px; border-radius: 25px; border: 3px solid #4cc9f0;
    background: rgba(0,0,0,0.6); color: #fff; text-align: center;
    font-size: 1.2rem; font-weight: bold; outline: none; margin-bottom: 15px;
  }

  .btn-play {
    width: 240px; padding: 14px; border-radius: 30px; border: none;
    background: linear-gradient(135deg, #2ec4b6, #0f9f90);
    color: #fff; font-size: 1.3rem; font-weight: 900; cursor: pointer;
    box-shadow: 0 6px 0 #0a665c, 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s; margin-bottom: 12px;
  }
  .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a665c; }

  .btn-skin {
    padding: 10px 24px; border-radius: 20px; border: 2px solid #fff;
    background: rgba(255,255,255,0.15); color: #fff; font-weight: bold; cursor: pointer;
  }

  /* HUD DEL JUEGO */
  #gameHUD {
    position: absolute; top: 20px; left: 20px; z-index: 50; display: none;
    color: #fff; font-weight: bold; font-size: 1.2rem;
  }
  .health-bar {
    width: 200px; height: 20px; background: rgba(0,0,0,0.5);
    border: 2px solid #fff; border-radius: 10px; overflow: hidden; margin-top: 5px;
  }
  .health-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }

  /* CONTROLES TÁCTILES */
  #gameControls {
    position: absolute; bottom: 20px; right: 20px; z-index: 50;
    display: none; gap: 15px;
  }

  .control-btn {
    width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(0,0,0,0.5); color: #fff; font-weight: 900; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
  }
  .btn-shoot { background: rgba(239, 68, 68, 0.8); }
  .btn-build { background: rgba(59, 130, 246, 0.8); }
  .control-btn:active { transform: scale(0.9); }

  #gameCanvas { width: 100%; height: 100%; display: block; background: #0b132b; }
</style>
</head>
<body>

  <!-- INTRO VM STUDIOS -->
  <div id="introScreen" onclick="startApp()">
    <div class="intro-logo">VM</div>
    <div class="intro-sub">STUDIOS</div>
    <div class="intro-hint">Toca la pantalla para continuar</div>
  </div>

  <!-- LOBBY SLITHER -->
  <div id="lobbyScreen" style="display: none;">
    <div class="slither-title">Countryballs War</div>
    
    <div class="avatar-container">
      <div id="avatarPreview" class="avatar-preview"></div>
    </div>
    
    <input type="text" id="nickInput" class="input-nick" value="Player 1" maxlength="12">
    
    <button class="btn-play" onclick="enterGame()">PLAY GAME</button>
    <button class="btn-skin" onclick="nextSkin()">Cambiar Ball</button>
  </div>

  <!-- HUD -->
  <div id="gameHUD">
    <div id="levelDisplay">Nivel: 1</div>
    <div class="health-bar"><div id="healthFill" class="health-fill"></div></div>
  </div>

  <!-- CONTROLES TÁCTILES -->
  <div id="gameControls">
    <div class="control-btn btn-build" onclick="buildStructure()">MURO</div>
    <div class="control-btn btn-shoot" onclick="shootBullet()">FUEGO</div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
  // AUDIO
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type='sine') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  function startApp() {
    playSound(450, 0.1);
    const intro = document.getElementById('introScreen');
    intro.style.opacity = '0';
    setTimeout(() => {
      intro.style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'flex';
    }, 800);
  }

  const skins = [
    { name: 'Portugal', flag: 'https://flagcdn.com/w320/pt.png' },
    { name: 'Brasil', flag: 'https://flagcdn.com/w320/br.png' },
    { name: 'Argentina', flag: 'https://flagcdn.com/w320/ar.png' },
    { name: 'Uruguay', flag: 'https://flagcdn.com/w320/uy.png' },
    { name: 'Chile', flag: 'https://flagcdn.com/w320/cl.png' },
    { name: 'Colombia', flag: 'https://flagcdn.com/w320/co.png' },
    { name: 'México', flag: 'https://flagcdn.com/w320/mx.png' },
    { name: 'USA', flag: 'https://flagcdn.com/w320/us.png' },
    { name: 'España', flag: 'https://flagcdn.com/w320/es.png' },
    { name: 'Canadá', flag: 'https://flagcdn.com/w320/ca.png' }
  ];
  let skinIdx = 0;

  const avatarPreview = document.getElementById('avatarPreview');
  function updateAvatar() {
    avatarPreview.style.backgroundImage = `url(${skins[skinIdx].flag})`;
  }
  function nextSkin() {
    playSound(450, 0.1);
    skinIdx = (skinIdx + 1) % skins.length;
    updateAvatar();
  }
  updateAvatar();

  let canvas, ctx;
  let inGame = false;
  let gameLevel = 1;
  let player = { x: 0, y: 0, radius: 35, hp: 100, maxHp: 100, img: new Image(), angle: 0 };
  let mouse = { x: 0, y: 0 };
  let foodList = [];
  let botBalls = [];
  let bullets = [];
  let structures = [];
  let particles = [];

  const loadedImages = {};
  skins.forEach(s => {
    const img = new Image();
    img.src = s.flag;
    loadedImages[s.name] = img;
  });

  function enterGame() {
    playSound(450, 0.1);
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameControls').style.display = 'flex';
    document.getElementById('gameHUD').style.display = 'block';
    
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    player.img = loadedImages[skins[skinIdx].name];
    player.x = 0; player.y = 0; player.hp = 100;
    mouse.x = canvas.width / 2; mouse.y = canvas.height / 2;
    gameLevel = 1;

    // Generar comida para sanar
    spawnFood();
    // Estructuras pregeneradas
    spawnInitialStructures();
    // Generar Enemigos del Nivel 1
    spawnBots();

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('touchmove', e => {
      if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, {passive: true});

    window.addEventListener('keydown', e => {
      if(e.code === 'Space') shootBullet();
      if(e.code === 'KeyE') buildStructure();
    });

    canvas.addEventListener('mousedown', e => { if(e.button === 0 && inGame) shootBullet(); });

    inGame = true;
    requestAnimationFrame(loop);
  }

  function spawnFood() {
    foodList = [];
    for(let i = 0; i < 200; i++) {
      foodList.push({
        x: (Math.random() - 0.5) * 3500,
        y: (Math.random() - 0.5) * 3500,
        r: 6 + Math.random() * 4,
        color: `hsl(${Math.random()*360}, 90%, 65%)`
      });
    }
  }

  function spawnInitialStructures() {
    structures = [];
    for(let i = 0; i < 30; i++) {
      structures.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        size: 50
      });
    }
  }

  function spawnBots() {
    let count = 5 + gameLevel * 3;
    botBalls = [];
    for(let i = 0; i < count; i++) {
      let randomSkin = skins[Math.floor(Math.random() * skins.length)];
      botBalls.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        radius: 30 + Math.random() * 10,
        hp: 30 + gameLevel * 10,
        img: loadedImages[randomSkin.name],
        angle: 0,
        lastShoot: Date.now() + Math.random() * 2000
      });
    }
  }

  function createExplosion(x, y, color) {
    playSound(150, 0.3, 'sawtooth');
    for(let i = 0; i < 20; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        r: Math.random() * 6 + 2,
        color: color || '#ff5500',
        life: 30
      });
    }
  }

  function shootBullet() {
    if(!inGame) return;
    playSound(300, 0.1, 'square');
    
    // Auto-Aim hacia el bot más cercano
    let targetAngle = player.angle;
    let closestBot = null;
    let minDist = 400;

    botBalls.forEach(bot => {
      let d = Math.hypot(bot.x - player.x, bot.y - player.y);
      if(d < minDist) { minDist = d; closestBot = bot; }
    });

    if(closestBot) {
      targetAngle = Math.atan2(closestBot.y - player.y, closestBot.x - player.x);
    }

    bullets.push({
      x: player.x + Math.cos(targetAngle) * (player.radius + 10),
      y: player.y + Math.sin(targetAngle) * (player.radius + 10),
      vx: Math.cos(targetAngle) * 14,
      vy: Math.sin(targetAngle) * 14,
      isEnemy: false,
      life: 70
    });
  }

  function buildStructure() {
    if(!inGame) return;
    playSound(200, 0.1);
    structures.push({
      x: player.x + Math.cos(player.angle) * (player.radius + 40),
      y: player.y + Math.sin(player.angle) * (player.radius + 40),
      size: 45
    });
  }

  function drawCountryball(x, y, radius, img, angle) {
    ctx.save();
    ctx.translate(x, y);

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.clip();
    if(img.complete) { ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2); }
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.stroke();

    let eyeOffsetX = Math.cos(angle) * (radius * 0.3);
    let eyeOffsetY = Math.sin(angle) * (radius * 0.3);

    ctx.beginPath();
    ctx.ellipse(eyeOffsetX - radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(eyeOffsetX + radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

    ctx.restore();
  }

  function loop() {
    if(!inGame) return;

    // Movimiento Jugador
    let dx = mouse.x - canvas.width / 2;
    let dy = mouse.y - canvas.height / 2;
    player.angle = Math.atan2(dy, dx);
    let dist = Math.hypot(dx, dy);
    if (dist > 10) {
      player.x += Math.cos(player.angle) * 4;
      player.y += Math.sin(player.angle) * 4;
    }

    // Curación al comer alimentos
    for(let i = foodList.length - 1; i >= 0; i--) {
      let f = foodList[i];
      if(Math.hypot(f.x - player.x, f.y - player.y) < player.radius) {
        player.hp = Math.min(player.maxHp, player.hp + 2);
        foodList.splice(i, 1);
      }
    }

    // Comportamiento de Bots (IA Enemiga)
    let now = Date.now();
    for(let bIdx = botBalls.length - 1; bIdx >= 0; bIdx--) {
      let bot = botBalls[bIdx];
      let bDist = Math.hypot(player.x - bot.x, player.y - bot.y);
      bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);

      // Persecución inteligente
      if(bDist > 150) {
        bot.x += Math.cos(bot.angle) * (2 + gameLevel * 0.3);
        bot.y += Math.sin(bot.angle) * (2 + gameLevel * 0.3);
      }

      // Disparo de Enemigos
      if(bDist < 500 && now - bot.lastShoot > Math.max(800, 2500 - gameLevel * 200)) {
        bot.lastShoot = now;
        bullets.push({
          x: bot.x + Math.cos(bot.angle) * (bot.radius + 5),
          y: bot.y + Math.sin(bot.angle) * (bot.radius + 5),
          vx: Math.cos(bot.angle) * 8,
          vy: Math.sin(bot.angle) * 8,
          isEnemy: true,
          life: 80
        });
      }
    }

    // Actualización de Proyectiles y Colisiones
    for(let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;

      // Choque con Muros
      let hitWall = false;
      structures.forEach(st => {
        if(Math.abs(b.x - st.x) < st.size/2 && Math.abs(b.y - st.y) < st.size/2) hitWall = true;
      });

      if(hitWall || b.life <= 0) {
        bullets.splice(i, 1);
        continue;
      }

      // Proyectiles vs Jugador
      if(b.isEnemy && Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
        player.hp -= 10;
        createExplosion(player.x, player.y, '#ef4444');
        bullets.splice(i, 1);
        if(player.hp <= 0) {
          alert('¡Fuiste eliminado! Reiniciando...');
          location.reload();
        }
        continue;
      }

      // Proyectiles Jugador vs Bots
      if(!b.isEnemy) {
        for(let bIdx = botBalls.length - 1; bIdx >= 0; bIdx--) {
          let bot = botBalls[bIdx];
          if(Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius) {
            bot.hp -= 20;
            createExplosion(bot.x, bot.y, '#ffcc00');
            bullets.splice(i, 1);
            
            if(bot.hp <= 0) {
              createExplosion(bot.x, bot.y, '#ff0055');
              botBalls.splice(bIdx, 1);
            }
            break;
          }
        }
      }
    }

    // Subir de Nivel si destruye a todos los enemigos
    if(botBalls.length === 0) {
      gameLevel++;
      document.getElementById('levelDisplay').innerText = `Nivel: ${gameLevel}`;
      spawnFood();
      spawnBots();
    }

    // Actualizar Partículas
    for(let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if(p.life <= 0) particles.splice(i, 1);
    }

    // Actualizar Barra de Vida
    document.getElementById('healthFill').style.width = `${Math.max(0, (player.hp / player.maxHp)*100)}%`;

    // RENDERIZADO
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Malla
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
    let gridOffsetX = (-player.x + canvas.width/2) % 60;
    let gridOffsetY = (-player.y + canvas.height/2) % 60;
    for (let x = gridOffsetX; x < canvas.width; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = gridOffsetY; y < canvas.height; y += 60) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Render Comida
    foodList.forEach(f => {
      let sx = f.x - player.x + canvas.width/2;
      let sy = f.y - player.y + canvas.height/2;
      ctx.beginPath(); ctx.arc(sx, sy, f.r, 0, Math.PI*2);
      ctx.fillStyle = f.color; ctx.fill();
    });

    // Render Estructuras
    structures.forEach(st => {
      let sx = st.x - player.x + canvas.width/2;
      let sy = st.y - player.y + canvas.height/2;
      ctx.fillStyle = '#475569'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4;
      ctx.fillRect(sx - st.size/2, sy - st.size/2, st.size, st.size);
      ctx.strokeRect(sx - st.size/2, sy - st.size/2, st.size, st.size);
    });

    // Render Balas
    bullets.forEach(b => {
      let sx = b.x - player.x + canvas.width/2;
      let sy = b.y - player.y + canvas.height/2;
      ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI*2);
      ctx.fillStyle = b.isEnemy ? '#ef4444' : '#f59e0b'; ctx.fill();
    });

    // Render Partículas de Explosión
    particles.forEach(p => {
      let sx = p.x - player.x + canvas.width/2;
      let sy = p.y - player.y + canvas.height/2;
      ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color; ctx.fill();
    });

    // Render Bots
    botBalls.forEach(bot => {
      let sx = bot.x - player.x + canvas.width/2;
      let sy = bot.y - player.y + canvas.height/2;
      drawCountryball(sx, sy, bot.radius, bot.img, bot.angle);
    });

    // Render Jugador
    drawCountryball(canvas.width/2, canvas.height/2, player.radius, player.img, player.angle);

    requestAnimationFrame(loop);
  }
</script>
</body>
 </html>
