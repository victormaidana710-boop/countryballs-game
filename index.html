<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola - Battle Royale</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: white;
        }

        /* LOBBY IDÉNTICO A LA REFERENCIA */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 20;
            padding: 15px;
        }
        .hidden { display: none !important; }

        .mission-panel {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mission-title { font-size: 14px; font-weight: bold; color: #facc15; }
        .mission-progress { font-size: 12px; color: #94a3b8; }

        .lobby-content {
            display: flex;
            flex: 1;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        /* Cuadrícula de Skins / Países */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(15, 23, 42, 0.8);
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #334155;
            max-height: 320px;
            overflow-y: auto;
        }
        .skin-item {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: #1e293b;
            transition: transform 0.2s;
        }
        .skin-item.selected {
            border-color: #facc15;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
        }

        /* Zona central de vista previa del personaje seleccionado */
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .preview-ball {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 5px solid #334155;
            position: relative;
            margin-bottom: 20px;
            font-size: 45px;
        }
        /* Gafas de sol para la vista previa */
        .preview-ball::after {
            content: '🕶️';
            position: absolute;
            font-size: 55px;
        }

        .btn-select {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
            letter-spacing: 1px;
            border: 2px solid #fef08a;
        }
        .btn-select:active { transform: scale(0.95); }

        /* Panel derecho de botones de dificultad */
        .difficulty-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 220px;
        }
        .diff-btn {
            background: #1e293b;
            color: white;
            border: 2px solid #475569;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .diff-btn.selected-diff {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        canvas {
            display: block;
            background: #15803d;
        }

        /* HUD FLOTANTE DEL JUEGO */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-element { pointer-events: auto; }
        .top-left-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* JOYSTICK REDONDO IZQUIERDO */
        #joystick-base {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(50,50,50,0.4) 0%, rgba(20,20,20,0.6) 100%);
            border: 3px dashed rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #joystick-base::before { content: '▲'; position: absolute; top: 5px; color: rgba(255,255,255,0.6); font-size: 12px; }
        #joystick-base::after { content: '▼'; position: absolute; bottom: 5px; color: rgba(255,255,255,0.6); font-size: 12px; }
        .joystick-arrow-l { position: absolute; left: 8px; color: rgba(255,255,255,0.6); font-size: 12px; }
        .joystick-arrow-r { position: absolute; right: 8px; color: rgba(255,255,255,0.6); font-size: 12px; }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #e2e8f0 0%, #94a3b8 100%);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* CONTROLES DERECHOS */
        .right-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            width: 75px;
            height: 75px;
            background: rgba(50, 50, 50, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .action-btn:active { transform: scale(0.92); }
        #shoot-btn {
            width: 95px;
            height: 95px;
            background: rgba(239, 68, 68, 0.9);
            border: 4px solid #fff;
            font-size: 36px;
        }
        .badge {
            position: absolute;
            bottom: 2px;
            right: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        #minimap {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 90px;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="lobbyScreen" class="screen">
        <div class="mission-panel">
            <div>
                <div class="mission-title">OPERACIÓN: LIGA BOLA</div>
                <div class="mission-progress">Progreso de Misión: 45%</div>
            </div>
            <div style="font-size: 12px; color: #facc15;">🎯 Elimina a 100 Bolas</div>
        </div>

        <div class="lobby-content">
            <div class="skins-grid">
                <div class="skin-item selected" onclick="selectSkin('🇺🇸', '#3b82f6')">🇺🇸</div>
                <div class="skin-item" onclick="selectSkin('🇲🇽', '#22c55e')">🇲🇽</div>
                <div class="skin-item" onclick="selectSkin('🇦🇷', '#0ea5e9')">🇦🇷</div>
                <div class="skin-item" onclick="selectSkin('🇧🇷', '#eab308')">🇧🇷</div>
                <div class="skin-item" onclick="selectSkin('🇩🇪', '#ef4444')">🇩🇪</div>
                <div class="skin-item" onclick="selectSkin('🇪🇸', '#f97316')">🇪🇸</div>
                <div class="skin-item" onclick="selectSkin('🇫🇷', '#6366f1')">🇫🇷</div>
                <div class="skin-item" onclick="selectSkin('🇯🇵', '#ec4899')">🇯🇵</div>
                <div class="skin-item" onclick="selectSkin('🇨🇦', '#dc2626')">🇨🇦</div>
            </div>

            <div class="preview-container">
                <div id="previewSkinBox" class="preview-ball" style="background: #3b82f6;">
                    🇺🇸
                </div>
                <button class="btn-select" onclick="startGame()">SELECCIONAR</button>
            </div>

            <div class="difficulty-panel">
                <div class="diff-btn selected-diff" id="btn-facil" onclick="setDifficulty('facil')">
                    <span>Partida: FÁCIL</span> ❌
                </div>
                <div class="diff-btn" id="btn-dificil" onclick="setDifficulty('dificil')">
                    <span>Partida: DIFÍCIL</span> ⚔️
                </div>
            </div>
        </div>
    </div>

    <div id="game-hud" class="hidden">
        <div class="top-left-info hud-element">
            <div>❤️ Vida: <span id="player-hp">100</span></div>
            <div>🏆 Vivos: <span id="alive-count">12</span></div>
            <div>🎯 Elim.: <span id="score">0</span></div>
        </div>

        <div id="minimap" class="hud-element"></div>

        <div id="joystick-base" class="hud-element">
            <span class="joystick-arrow-l">◀</span>
            <span class="joystick-arrow-r">▶</span>
            <div id="joystick-stick"></div>
        </div>

        <div class="right-controls hud-element">
            <div class="action-btn" ontouchstart="useMedkit()" onclick="useMedkit()" title="Botiquín">
                ➕
                <div class="badge" id="medkit-count">2</div>
            </div>
            <div class="action-btn" id="shoot-btn" ontouchstart="manualShoot()" onclick="manualShoot()" title="Disparar">
                🎯
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" class="hidden"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let selectedSkinEmoji = "🇺🇸";
    let selectedSkinBg = "#3b82f6";
    let difficultyMode = "facil";
    let botSpeed = 1.5;
    let score = 0;
    let playerHp = 100;
    let medkits = 2;
    let gameRunning = false;

    const mapWidth = 2500;
    const mapHeight = 2500;

    let player = { x: 0, y: 0, radius: 26, speed: 4.5 };
    let structures = [];
    let bots = [];
    let bullets = [];

    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };

    function selectSkin(emoji, color) {
        selectedSkinEmoji = emoji;
        selectedSkinBg = color;
        document.getElementById("previewSkinBox").style.background = color;
        document.getElementById("previewSkinBox").innerText = emoji;
        document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function setDifficulty(mode) {
        difficultyMode = mode;
        document.getElementById("btn-facil").classList.remove("selected-diff");
        document.getElementById("btn-dificil").classList.remove("selected-diff");
        document.getElementById("btn-" + mode).classList.add("selected-diff");
    }

    function startGame() {
        botSpeed = (difficultyMode === 'dificil') ? 3.0 : 1.5;
        playerHp = 100;
        medkits = 2;
        score = 0;

        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("game-hud").classList.remove("hidden");
        canvas.classList.remove("hidden");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        player.x = mapWidth / 2;
        player.y = mapHeight / 2;

        structures = [
            { x: 300, y: 300, width: 140, height: 70 },
            { x: 700, y: 200, width: 80, height: 180 },
            { x: 1200, y: 400, width: 200, height: 90 },
            { x: 400, y: 900, width: 100, height: 160 },
            { x: 900, y: 800, width: 150, height: 150 },
            { x: 1500, y: 800, width: 120, height: 80 },
            { x: 300, y: 1500, width: 180, height: 90 },
            { x: 800, y: 1400, width: 90, height: 190 },
            { x: 1400, y: 1300, width: 160, height: 160 }
        ];

        bots = [];
        const botSkins = [
            { emoji: "🇲🇽", bg: "#22c55e" },
            { emoji: "🇦🇷", bg: "#0ea5e9" },
            { emoji: "🇧🇷", bg: "#eab308" },
            { emoji: "🇩🇪", bg: "#ef4444" },
            { emoji: "🇫🇷", bg: "#6366f1" }
        ];

        for (let i = 0; i < 12; i++) {
            let skinInfo = botSkins[Math.floor(Math.random() * botSkins.length)];
            bots.push({
                x: Math.random() * (mapWidth - 200) + 100,
                y: Math.random() * (mapHeight - 200) + 100,
                radius: 26,
                emoji: skinInfo.emoji,
                color: skinInfo.bg,
                alive: true
            });
        }

        setupJoystick();
        gameRunning = true;
        loop();
    }

    function setupJoystick() {
        const base = document.getElementById("joystick-base");
        const stick = document.getElementById("joystick-stick");
        const maxDist = 45;

        function handleStartMove(e) {
            e.preventDefault();
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.hypot(dx, dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxDist, y: dy / maxDist };
            joystickActive = true;
        }

        function handleEnd() {
            stick.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
            joystickActive = false;
        }

        base.addEventListener("touchstart", handleStartMove);
        base.addEventListener("touchmove", handleStartMove);
        base.addEventListener("touchend", handleEnd);

        base.addEventListener("mousedown", (e) => {
            const onMouseMove = (ev) => handleStartMove(ev);
            const onMouseUp = () => {
                window.removeEventListener("mousemove", onMouseMove);
                handleEnd();
            };
            window.addEventListener("mousemove", onMouseMove);
            window.addEventListener("mouseup", onMouseUp, { once: true });
        });
    }

    function manualShoot() {
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        let angle = closestBot ? Math.atan2(closestBot.y - player.y, closestBot.x - player.x) : 0;
        bullets.push({
            x: player.x, y: player.y,
            dx: Math.cos(angle) * 10, dy: Math.sin(angle) * 10,
            radius: 6, isPlayer: true
        });
    }

    function useMedkit() {
        if (medkits > 0 && playerHp < 100) {
            medkits--;
            playerHp = Math.min(100, playerHp + 40);
            document.getElementById("player-hp").innerText = playerHp;
            document.getElementById("medkit-count").innerText = medkits;
        }
    }

    function update() {
        if (!gameRunning) return;

        if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
            let nextX = player.x + joystickVector.x * player.speed;
            let nextY = player.y + joystickVector.y * player.speed;

            nextX = Math.max(player.radius, Math.min(mapWidth - player.radius, nextX));
            nextY = Math.max(player.radius, Math.min(mapHeight - player.radius, nextY));

            let collide = false;
            structures.forEach(s => {
                if (nextX > s.x - player.radius && nextX < s.x + s.width + player.radius && 
                    nextY > s.y - player.radius && nextY < s.y + s.height + player.radius) {
                    collide = true;
                }
            });

            if (!collide) {
                player.x = nextX;
                player.y = nextY;
            }
        }

        let aliveBotsCount = 0;
        bots.forEach(bot => {
            if (bot.alive) {
                aliveBotsCount++;
                let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                let nextBotX = bot.x + Math.cos(angle) * botSpeed;
                let nextBotY = bot.y + Math.sin(angle) * botSpeed;

                let distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
                if (distToPlayer < player.radius + bot.radius) {
                    playerHp -= 0.5;
                    document.getElementById("player-hp").innerText = Math.max(0, Math.floor(playerHp));
                    if (playerHp <= 0) {
                        gameRunning = false;
                        alert("¡Has sido eliminado! Fin de la partida.");
                        location.reload();
                    }
                }

                let botCollide = false;
                structures.forEach(s => {
                    if (nextBotX > s.x - bot.radius && nextBotX < s.x + s.width + bot.radius && 
                        nextBotY > s.y - bot.radius && nextBotY < s.y + s.height + bot.radius) {
                        botCollide = true;
                    }
                });

                if (!botCollide) {
                    bot.x = nextBotX;
                    bot.y = nextBotY;
                }
            }
        });

        document.getElementById("alive-count").innerText = aliveBotsCount + 1;

        bullets.forEach((b, index) => {
            b.x += b.dx;
            b.y += b.dy;

            bots.forEach(bot => {
                if (bot.alive && b.isPlayer && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius + b.radius) {
                    bot.alive = false;
                    score += 1;
                    document.getElementById("score").innerText = score;
                    bullets.splice(index, 1);
                }
            });
        });
    }

    function drawCountry
