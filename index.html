<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola - Battle Royale</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: white;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 20;
            padding: 20px;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 28px;
            color: #facc15;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .skins-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .skin-option {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .skin-option.selected {
            border-color: #facc15;
            transform: scale(1.15);
        }
        canvas {
            display: block;
            background: #15803d;
        }

        /* HUD FLOTANTE ESTILO FREE FIRE */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-element {
            pointer-events: auto;
        }
        .top-left-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* Botón de disparo flotante derecho */
        #shoot-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 85px;
            height: 85px;
            background: rgba(239, 68, 68, 0.85);
            border: 4px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #shoot-btn:active {
            transform: scale(0.9);
            background: rgba(220, 38, 38, 1);
        }

        /* JOYSTICK VIRTUAL IZQUIERDO */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #joystick-stick {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        #minimap {
            position: absolute;
            top: 15px;
            left: 140px;
            width: 90px;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="lobbyScreen" class="screen">
        <h1>LIGA BOLA: BATTLE ROYALE</h1>
        <p>Selecciona tu Skin de Countryball:</p>
        
        <div class="skins-container">
            <div class="skin-option selected" style="background: #38bdf8;" onclick="selectSkin('#38bdf8')">🇦🇷</div>
            <div class="skin-option" style="background: #f87171;" onclick="selectSkin('#f87171')">🇺🇸</div>
            <div class="skin-option" style="background: #fbbf24;" onclick="selectSkin('#fbbf24')">🇩🇪</div>
        </div>

        <p>Dificultad:</p>
        <div>
            <button class="btn" onclick="startGame('facil')">FÁCIL</button>
            <button class="btn" onclick="startGame('dificil')">DIFÍCIL</button>
        </div>
    </div>

    <div id="game-hud" class="hidden">
        <div class="top-left-info hud-element">
            <div>Vivos: <span id="alive-count">12</span></div>
            <div>Eliminaciones: <span id="score">0</span></div>
        </div>

        <div id="minimap" class="hud-element"></div>

        <div id="joystick-base" class="hud-element">
            <div id="joystick-stick"></div>
        </div>

        <div id="shoot-btn" class="hud-element" ontouchstart="manualShoot()" onmousedown="manualShoot()">🎯</div>
    </div>

    <canvas id="gameCanvas" class="hidden"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let playerColor = "#38bdf8";
    let botSpeed = 1.8;
    let score = 0;
    let gameRunning = false;

    const mapWidth = 2500;
    const mapHeight = 2500;

    let player = { x: 0, y: 0, radius: 24, speed: 4.5 };
    let structures = [];
    let bots = [];
    let bullets = [];

    // Control del Joystick
    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };

    function selectSkin(color) {
        playerColor = color;
        document.querySelectorAll('.skin-option').forEach(el => el.classList.remove('selected'));
        event.target.classList.add('selected');
    }

    function startGame(difficulty) {
        botSpeed = (difficulty === 'dificil') ? 3.0 : 1.5;

        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("game-hud").classList.remove("hidden");
        canvas.classList.remove("hidden");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        player.x = mapWidth / 2;
        player.y = mapHeight / 2;

        // Estructuras de cobertura
        structures = [
            { x: 300, y: 300, width: 140, height: 70 },
            { x: 700, y: 200, width: 80, height: 180 },
            { x: 1200, y: 400, width: 200, height: 90 },
            { x: 400, y: 900, width: 100, height: 160 },
            { x: 900, y: 800, width: 150, height: 150 },
            { x: 1500, y: 800, width: 120, height: 80 },
            { x: 300, y: 1500, width: 180, height: 90 },
            { x: 800, y: 1400, width: 90, height: 190 },
            { x: 1400, y: 1300, width: 160, height: 160 }
        ];

        // Bots enemigos
        bots = [];
        for (let i = 0; i < 12; i++) {
            bots.push({
                x: Math.random() * (mapWidth - 200) + 100,
                y: Math.random() * (mapHeight - 200) + 100,
                radius: 24,
                color: ["#ef4444", "#a855f7", "#3b82f6", "#ec4899"][Math.floor(Math.random() * 4)],
                alive: true
            });
        }

        setupJoystick();
        gameRunning = true;
        loop();
    }

    function setupJoystick() {
        const base = document.getElementById("joystick-base");
        const stick = document.getElementById("joystick-stick");
        const maxDist = 45;

        function handleStartMove(e) {
            e.preventDefault();
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.hypot(dx, dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxDist, y: dy / maxDist };
            joystickActive = true;
        }

        function handleEnd() {
            stick.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
            joystickActive = false;
        }

        base.addEventListener("touchstart", handleStartMove);
        base.addEventListener("touchmove", handleStartMove);
        base.addEventListener("touchend", handleEnd);

        base.addEventListener("mousedown", (e) => {
            window.addEventListener("mousemove", handleStartMove);
            window.addEventListener("mouseup", () => {
                window.removeEventListener("mousemove", handleStartMove);
                handleEnd();
            }, { once: true });
        });
    }

    function manualShoot() {
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        let angle = closestBot ? Math.atan2(closestBot.y - player.y, closestBot.x - player.x) : 0;
        bullets.push({
            x: player.x, y: player.y,
            dx: Math.cos(angle) * 10, dy: Math.sin(angle) * 10,
            radius: 6, isPlayer: true
        });
    }

    function update() {
        if (!gameRunning) return;

        // Moverse usando el joystick izquierdo
        if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
            let nextX = player.x + joystickVector.x * player.speed;
            let nextY = player.y + joystickVector.y * player.speed;

            nextX = Math.max(player.radius, Math.min(mapWidth - player.radius, nextX));
            nextY = Math.max(player.radius, Math.min(mapHeight - player.radius, nextY));

            let collide = false;
            structures.forEach(s => {
                if (nextX > s.x - player.radius && nextX < s.x + s.width + player.radius && 
                    nextY > s.y - player.radius && nextY < s.y + s.height + player.radius) {
                    collide = true;
                }
            });

            if (!collide) {
                player.x = nextX;
                player.y = nextY;
            }
        }

        let aliveBotsCount = 0;
        bots.forEach(bot => {
            if (bot.alive) {
                aliveBotsCount++;
                let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                let nextBotX = bot.x + Math.cos(angle) * botSpeed;
                let nextBotY = bot.y + Math.sin(angle) * botSpeed;

                let botCollide = false;
                structures.forEach(s => {
                    if (nextBotX > s.x - bot.radius && nextBotX < s.x + s.width + bot.radius && 
                        nextBotY > s.y - bot.radius && nextBotY < s.y + s.height + bot.radius) {
                        botCollide = true;
                    }
                });

                if (!botCollide) {
                    bot.x = nextBotX;
                    bot.y = nextBotY;
                }
            }
        });

        document.getElementById("alive-count").innerText = aliveBotsCount + 1;

        bullets.forEach((b, index) => {
            b.x += b.dx;
            b.y += b.dy;

            bots.forEach(bot => {
                if (bot.alive && b.isPlayer && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius + b.radius) {
                    bot.alive = false;
                    score += 1;
                    document.getElementById("score").innerText = score;
                    bullets.splice(index, 1);
                }
            });
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        let cameraX = canvas.width / 2 - player.x;
        let cameraY = canvas.height / 2 - player.y;
        ctx.translate(cameraX, cameraY);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 2;
        for (let x = 0; x < mapWidth; x += 100) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapHeight); ctx.stroke();
        }
        for (let y = 0; y < mapHeight; y += 100) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapWidth, y); ctx.stroke();
        }

        structures.forEach(s => {
            ctx.fillStyle = "#334155";
            ctx.fillRect(s.x, s.y, s.width, s.height);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#1e293b";
            ctx.strokeRect(s.x, s.y, s.width, s.height);
        });

        bots.forEach(bot => {
            if (bot.alive) {
                ctx.beginPath();
                ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#000";
                ctx.stroke();
                ctx.closePath();
            }
        });

        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = playerColor;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = "#facc15";
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
        });

        ctx.restore();
    }

    function loop() {
        if (gameRunning) {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    }
</script>

</body>
</html>
