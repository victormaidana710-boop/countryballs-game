<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola - Battle Royale HD (Horizontal)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: white;
            width: 100vw;
            height: 100vh;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 20;
            padding: 15px;
            justify-content: space-between;
        }
        .hidden { display: none !important; }

        /* Panel superior de Misión */
        .mission-panel {
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mission-title { font-size: 13px; font-weight: bold; color: #facc15; }
        .mission-progress { font-size: 11px; color: #94a3b8; }

        /* Contenido del Lobby en Horizontal */
        .lobby-content {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }
        .skin-item {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #1e293b;
        }
        .skin-item.selected {
            border-color: #facc15;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .preview-ball-hd {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #60a5fa 0%, #1d4ed8 70%, #1e3a8a 100%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7), inset -6px -6px 15px rgba(0,0,0,0.5);
            border: 3px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }

        .btn-select {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.5);
            border: 2px solid #fef08a;
        }
        .btn-select:active { transform: scale(0.95); }

        .difficulty-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .diff-btn {
            background: #1e293b;
            color: white;
            border: 2px solid #475569;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .diff-btn.selected-diff {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        canvas {
            display: block;
            background: #166534;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD FLOTANTE HORIZONTAL */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-element { pointer-events: auto; }
        .top-left-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* JOYSTICK IZQUIERDO */
        #joystick-base {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, rgba(30,41,59,0.6) 0%, rgba(15,23,42,0.8) 100%);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #joystick-stick {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cbd5e1 60%, #64748b 100%);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        /* CONTROLES DERECHOS */
        .right-controls {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            width: 65px;
            height: 65px;
            background: rgba(30, 41, 59, 0.85);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            position: relative;
        }
        #shoot-btn {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #f87171 0%, #dc2626 100%);
            border: 4px solid #fff;
            font-size: 32px;
        }
        .badge {
            position: absolute;
            bottom: 2px;
            right: 5px;
            background: #0f172a;
            color: #fff;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="lobbyScreen" class="screen">
        <div class="mission-panel">
            <div>
                <div class="mission-title">OPERACIÓN: LIGA BOLA (HORIZONTAL)</div>
                <div class="mission-progress">Progreso: 45%</div>
            </div>
            <div style="font-size: 12px; color: #facc15;">🎯 Elimina a 100</div>
        </div>

        <div class="lobby-content">
            <div class="skins-grid">
                <div class="skin-item selected" onclick="selectSkin(event, '🇺🇸', '#3b82f6', '#1e3a8a')">🇺🇸</div>
                <div class="skin-item" onclick="selectSkin(event, '🇲🇽', '#22c55e', '#14532d')">🇲🇽</div>
                <div class="skin-item" onclick="selectSkin(event, '🇦🇷', '#0ea5e9', '#0369a1')">🇦🇷</div>
                <div class="skin-item" onclick="selectSkin(event, '🇧🇷', '#eab308', '#a16207')">🇧🇷</div>
                <div class="skin-item" onclick="selectSkin(event, '🇩🇪', '#ef4444', '#7f1d1d')">🇩🇪</div>
                <div class="skin-item" onclick="selectSkin(event, '🇪🇸', '#f97316', '#c2410c')">🇪🇸</div>
                <div class="skin-item" onclick="selectSkin(event, '🇫🇷', '#6366f1', '#3730a3')">🇫🇷</div>
            </div>

            <div class="preview-container">
                <div id="previewBall" class="preview-ball-hd">
                    <span style="font-size: 40px;">🇺🇸</span>
                    <span style="position: absolute; font-size: 35px;">🕶️</span>
                </div>
                <button class="btn-select" onclick="startGame()">SELECCIONAR</button>
            </div>

            <div class="difficulty-panel">
                <div class="diff-btn selected-diff" id="btn-facil" onclick="setDifficulty('facil')">Partida: FÁCIL 🟢</div>
                <div class="diff-btn" id="btn-dificil" onclick="setDifficulty('dificil')">Partida: DIFÍCIL 🔴</div>
            </div>
        </div>
    </div>

    <div id="game-hud" class="hidden">
        <div class="top-left-info hud-element">
            <div>❤️ Vida: <span id="player-hp">100</span></div>
            <div>🏆 Vivos: <span id="alive-count">12</span></div>
            <div>🎯 Elim.: <span id="score">0</span></div>
        </div>

        <div id="joystick-base" class="hud-element">
            <div id="joystick-stick"></div>
        </div>

        <div class="right-controls hud-element">
            <div class="action-btn" onclick="useMedkit()">
                ➕
                <div class="badge" id="medkit-count">2</div>
            </div>
            <div class="action-btn" id="shoot-btn" onclick="manualShoot()">
                🎯
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentSkinEmoji = "🇺🇸";
    let skinColor1 = "#3b82f6";
    let skinColor2 = "#1e3a8a";
    let difficultyMode = "facil";
    let botSpeed = 1.5;
    let score = 0;
    let playerHp = 100;
    let medkits = 2;
    let gameRunning = false;

    const mapWidth = 2500;
    const mapHeight = 2500;

    let player = { x: 0, y: 0, radius: 28, speed: 4.5 };
    let structures = [];
    let bots = [];
    let bullets = [];

    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };

    // Forzar orientación horizontal si el navegador lo soporta
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
    }

    function selectSkin(e, emoji, c1, c2) {
        currentSkinEmoji = emoji;
        skinColor1 = c1;
        skinColor2 = c2;
        document.getElementById("previewBall").style.background = `radial-gradient(circle at 35% 35%, ${c1} 0%, ${c2} 100%)`;
        document.getElementById("previewBall").children[0].innerText = emoji;
        document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('selected'));
        if (e && e.currentTarget) e.currentTarget.classList.add('selected');
    }

    function setDifficulty(mode) {
        difficultyMode = mode;
        document.getElementById("btn-facil").classList.remove("selected-diff");
        document.getElementById("btn-dificil").classList.remove("selected-diff");
        document.getElementById("btn-" + mode).classList.add("selected-diff");
    }

    function startGame() {
        botSpeed = (difficultyMode === 'dificil') ? 3.0 : 1.5;
        playerHp = 100;
        medkits = 2;
        score = 0;

        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("game-hud").classList.remove("hidden");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        player.x = mapWidth / 2;
        player.y = mapHeight / 2;

        structures = [
            { x: 300, y: 300, width: 140, height: 70 },
            { x: 700, y: 200, width: 80, height: 180 },
            { x: 1200, y: 400, width: 200, height: 90 },
            { x: 400, y: 900, width: 100, height: 160 },
            { x: 900, y: 800, width: 150, height: 150 }
        ];

        bots = [];
        const botPalettes = [
            { emoji: "🇲🇽", c1: "#22c55e", c2: "#14532d" },
            { emoji: "🇦🇷", c1: "#0ea5e9", c2: "#0369a1" },
            { emoji: "🇧🇷", c1: "#eab308", c2: "#a16207" }
        ];

        for (let i = 0; i < 8; i++) {
            let pal = botPalettes[Math.floor(Math.random() * botPalettes.length)];
            bots.push({
                x: Math.random() * (mapWidth - 200) + 100,
                y: Math.random() * (mapHeight - 200) + 100,
                radius: 28,
                emoji: pal.emoji,
                c1: pal.c1,
                c2: pal.c2,
                alive: true
            });
        }

        setupJoystick();
        gameRunning = true;
        requestAnimationFrame(loop);
    }

    function setupJoystick() {
        const base = document.getElementById("joystick-base");
        const stick = document.getElementById("joystick-stick");
        const maxDist = 35;

        function handleStartMove(e) {
            e.preventDefault();
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.hypot(dx, dy);

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxDist, y: dy / maxDist };
            joystickActive = true;
        }

        function handleEnd() {
            stick.style.transform = `translate(0px, 0px)`;
            joystickVector = { x: 0, y: 0 };
            joystickActive = false;
        }

        base.addEventListener("touchstart", handleStartMove, { passive: false });
        base.addEventListener("touchmove", handleStartMove, { passive: false });
        base.addEventListener("touchend", handleEnd);
    }

    function manualShoot() {
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        let angle = closestBot ? Math.atan2(closestBot.y - player.y, closestBot.x - player.x) : 0;
        bullets.push({
            x: player.x, y: player.y,
            dx: Math.cos(angle) * 12, dy: Math.sin(angle) * 12,
            radius: 6, isPlayer: true
        });
    }

    function useMedkit() {
        if (medkits > 0 && playerHp < 100) {
            medkits--;
            playerHp = Math.min(100, playerHp + 40);
            document.getElementById("player-hp").innerText = playerHp;
            document.getElementById("medkit-count").innerText = medkits;
        }
    }

    function update() {
        if (!gameRunning) return;

        if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
            let nextX = player.x + joystickVector.x * player.speed;
            let nextY = player.y + joystickVector.y * player.speed;
            player.x = Math.max(player.radius, Math.min(mapWidth - player.radius, nextX));
            player.y = Math.max(player.radius, Math.min(mapHeight - player.radius, nextY));
        }

        let aliveBotsCount = 0;
        bots.forEach(bot => {
            if (bot.alive) {
                aliveBotsCount++;
                let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                bot.x += Math.cos(angle) * botSpeed;
                bot.y += Math.sin(angle) * botSpeed;

                if (Math.hypot(player.x - bot.x, player.y - bot.y) < player.radius + bot.radius) {
                    playerHp -= 0.5;
                    document.getElementById("player-hp").innerText = Math.max(0, Math.floor(playerHp));
                    if (playerHp <= 0) {
                        gameRunning = false;
                        alert("¡Eliminado!");
                        location.reload();
                    }
                }
            }
        });

        document.getElementById("alive-count").innerText = aliveBotsCount + 1;

        bullets.forEach((b, index) => {
            b.x += b.dx;
            b.y += b.dy;
            bots.forEach(bot => {
                if (bot.alive && b.isPlayer && Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius + b.radius) {
                    bot.alive = false;
                    score += 1;
                    document.getElementById("score").innerText = score;
                    bullets.splice(index, 1);
                }
            });
        });
    }

    function drawCountryball(x, y, radius, emoji, c1, c2) {
        ctx.save();
        let grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
        grad.addColorStop(0, c1);
        grad.addColorStop(0.8, c2);
        grad.addColorStop(1, "#020617");

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        ctx.font = `${radius * 1.1}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, x, y);
        ctx.fillText("🕶️", x, y - 2);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 2;
        for (let x = 0; x < mapWidth; x += 100) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, mapHeight); ctx.stroke();
        }
        for (let y = 0; y < mapHeight; y += 100) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(mapWidth, y); ctx.stroke();
        }

        structures.forEach(s => {
            ctx.fillStyle = "#334155";
            ctx.fillRect(s.x, s.y, s.width, s.height);
        });

        bots.forEach(bot => {
            if (bot.alive) drawCountryball(bot.x, bot.y, bot.radius, bot.emoji, bot.c1, bot.c2);
        });

        drawCountryball(player.x, player.y, player.radius, currentSkinEmoji, skinColor1, skinColor2);

        ctx.fillStyle = "#facc15";
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }

    function loop() {
        if (gameRunning) {
            update();
            draw();
            requestAnimationFrame(loop);
        }
    }
</script>

</body>
    </html>
