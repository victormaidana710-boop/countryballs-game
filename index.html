<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liga Bola - Battle Royale HD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: white;
            width: 100vw;
            height: 100vh;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 20;
            padding: 15px;
            justify-content: space-between;
        }
        .hidden { display: none !important; }

        .mission-panel {
            width: 100%;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mission-title { font-size: 13px; font-weight: bold; color: #facc15; }
        .mission-progress { font-size: 11px; color: #94a3b8; }

        .lobby-content {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            padding: 10px 0;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }
        .skin-item {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: #1e293b;
            touch-action: manipulation;
        }
        .skin-item.selected {
            border-color: #facc15;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .preview-ball-hd {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #60a5fa 0%, #1d4ed8 70%, #1e3a8a 100%);
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            border: 3px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }

        .btn-select {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.5);
            border: 2px solid #fef08a;
            touch-action: manipulation;
            z-index: 30;
        }
        .btn-select:active { transform: scale(0.95); }

        .difficulty-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .diff-btn {
            background: #1e293b;
            color: white;
            border: 2px solid #475569;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            touch-action: manipulation;
        }
        .diff-btn.selected-diff {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }

        canvas {
            display: block;
            background: #166534;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .hud-element { pointer-events: auto; }
        .top-left-info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #joystick-base {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, rgba(30,41,59,0.6) 0%, rgba(15,23,42,0.8) 100%);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #joystick-stick {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #cbd5e1 60%, #64748b 100%);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        .right-controls {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .action-btn {
            width: 65px;
            height: 65px;
            background: rgba(30, 41, 59, 0.85);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
        }
        #shoot-btn {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #f87171 0%, #dc2626 100%);
            border: 4px solid #fff;
            font-size: 32px;
            touch-action: manipulation;
        }
        .badge {
            position: absolute;
            bottom: 2px;
            right: 5px;
            background: #0f172a;
            color: #fff;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="lobbyScreen" class="screen">
        <div class="mission-panel">
            <div>
                <div class="mission-title">OPERACIÓN: LIGA BOLA (HORIZONTAL)</div>
                <div class="mission-progress">Progreso: 45%</div>
            </div>
            <div style="font-size: 12px; color: #facc15;">🎯 Elimina a 100</div>
        </div>

        <div class="lobby-content">
            <div class="skins-grid">
                <div class="skin-item selected" data-emoji="🇺🇸" data-c1="#3b82f6" data-c2="#1e3a8a">🇺🇸</div>
                <div class="skin-item" data-emoji="🇲🇽" data-c1="#22c55e" data-c2="#14532d">🇲🇽</div>
                <div class="skin-item" data-emoji="🇦🇷" data-c1="#0ea5e9" data-c2="#0369a1">🇦🇷</div>
                <div class="skin-item" data-emoji="🇧🇷" data-c1="#eab308" data-c2="#a16207">🇧🇷</div>
                <div class="skin-item" data-emoji="🇩🇪" data-c1="#ef4444" data-c2="#7f1d1d">🇩🇪</div>
                <div class="skin-item" data-emoji="🇪🇸" data-c1="#f97316" data-c2="#c2410c">🇪🇸</div>
                <div class="skin-item" data-emoji="🇫🇷" data-c1="#6366f1" data-c2="#3730a3">🇫🇷</div>
            </div>

            <div class="preview-container">
                <div id="previewBall" class="preview-ball-hd">
                    <span style="font-size: 40px;">🇺🇸</span>
                    <span style="position: absolute; font-size: 35px;">🕶️</span>
                </div>
                <button id="startBtn" class="btn-select">SELECCIONAR</button>
            </div>

            <div class="difficulty-panel">
                <div class="diff-btn selected-diff" id="btn-facil" data-mode="facil">Partida: FÁCIL 🟢</div>
                <div class="diff-btn" id="btn-dificil" data-mode="dificil">Partida: DIFÍCIL 🔴</div>
            </div>
        </div>
    </div>

    <div id="game-hud" class="hidden">
        <div class="top-left-info hud-element">
            <div>❤️ Vida: <span id="player-hp">100</span></div>
            <div>🏆 Vivos: <span id="alive-count">12</span></div>
            <div>🎯 Elim.: <span id="score">0</span></div>
        </div>

        <div id="joystick-base" class="hud-element">
            <div id="joystick-stick"></div>
        </div>

        <div class="right-controls hud-element">
            <div class="action-btn" id="medkit-btn">
                ➕
                <div class="badge" id="medkit-count">2</div>
            </div>
            <div class="action-btn" id="shoot-btn">
                🎯
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let currentSkinEmoji = "🇺🇸";
    let skinColor1 = "#3b82f6";
    let skinColor2 = "#1e3a8a";
    let difficultyMode = "facil";
    let botSpeed = 1.5;
    let score = 0;
    let playerHp = 100;
    let medkits = 2;
    let gameRunning = false;

    const mapWidth = 2500;
    const mapHeight = 2500;

    let player = { x: 0, y: 0, radius: 28, speed: 4.5 };
    let structures = [];
    let bots = [];
    let bullets = [];

    let joystickActive = false;
    let joystickVector = { x: 0, y: 0 };
    let joystickTouchId = null;

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(() => {});
    }

    // Configurar eventos de selección de Skin (soporta clic y toque directo)
    document.querySelectorAll('.skin-item').forEach(item => {
        const selectSkinAction = (e) => {
            e.preventDefault();
            currentSkinEmoji = item.getAttribute('data-emoji');
            skinColor1 = item.getAttribute('data-c1');
            skinColor2 = item.getAttribute('data-c2');
            
            document.getElementById("previewBall").style.background = `radial-gradient(circle at 35% 35%, ${skinColor1} 0%, ${skinColor2} 100%)`;
            document.getElementById("previewBall").children[0].innerText = currentSkinEmoji;
            
            document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('selected'));
            item.classList.add('selected');
        };

        item.addEventListener("click", selectSkinAction);
        item.addEventListener("touchstart", selectSkinAction, { passive: false });
    });

    // Configurar selección de Dificultad
    ['facil', 'dificil'].forEach(mode => {
        const btn = document.getElementById("btn-" + mode);
        const setDiffAction = (e) => {
            e.preventDefault();
            difficultyMode = mode;
            document.getElementById("btn-facil").classList.remove("selected-diff");
            document.getElementById("btn-dificil").classList.remove("selected-diff");
            btn.classList.add("selected-diff");
        };

        btn.addEventListener("click", setDiffAction);
        btn.addEventListener("touchstart", setDiffAction, { passive: false });
    });

    // Botón Iniciar / Seleccionar partida
    const startBtn = document.getElementById("startBtn");
    const triggerStart = (e) => {
        e.preventDefault();
        startGame();
    };
    startBtn.addEventListener("click", triggerStart);
    startBtn.addEventListener("touchstart", triggerStart, { passive: false });

    function startGame() {
        botSpeed = (difficultyMode === 'dificil') ? 3.0 : 1.5;
        playerHp = 100;
        medkits = 2;
        score = 0;

        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("game-hud").classList.remove("hidden");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        player.x = mapWidth / 2;
        player.y = mapHeight / 2;

        structures = [
            { x: 400, y: 400, width: 180, height: 90 },
            { x: 800, y: 300, width: 100, height: 200 },
            { x: 1300, y: 500, width: 220, height: 100 },
            { x: 500, y: 1000, width: 120, height: 180 },
            { x: 1000, y: 900, width: 160, height: 160 },
            { x: 1600, y: 900, width: 140, height: 90 },
            { x: 400, y: 1600, width: 200, height: 100 },
            { x: 900, y: 1500, width: 110, height: 210 },
            { x: 1500, y: 1400, width: 180, height: 180 }
        ];

        bots = [];
        const botPalettes = [
            { emoji: "🇲🇽", c1: "#22c55e", c2: "#14532d" },
            { emoji: "🇦🇷", c1: "#0ea5e9", c2: "#0369a1" },
            { emoji: "🇧🇷", c1: "#eab308", c2: "#a16207" },
            { emoji: "🇩🇪", c1: "#ef4444", c2: "#7f1d1d" }
        ];

        for (let i = 0; i < 10; i++) {
            let pal = botPalettes[Math.floor(Math.random() * botPalettes.length)];
            bots.push({
                x: Math.random() * (mapWidth - 400) + 200,
                y: Math.random() * (mapHeight - 400) + 200,
                radius: 28,
                emoji: pal.emoji,
                c1: pal.c1,
                c2: pal.c2,
                alive: true
            });
        }

        setupMultitouchControls();
        gameRunning = true;
        requestAnimationFrame(loop);
    }

    function setupMultitouchControls() {
        const base = document.getElementById("joystick-base");
        const stick = document.getElementById("joystick-stick");
        const maxDist = 35;

        base.addEventListener("touchstart", (e) => {
            e.preventDefault();
            let touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            updateJoystickPos(touch, base, stick, maxDist);
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    updateJoystickPos(touch, base, stick, maxDist);
                }
            }
        }, { passive: false });

        window.addEventListener("touchend", (e) => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    resetJoystick(stick);
                }
            }
        });

        const shootBtn = document.getElementById("shoot-btn");
        shootBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            manualShoot();
        }, { passive: false });
        shootBtn.addEventListener("click", () => {
            manualShoot();
        });

        const medkitBtn = document.getElementById("medkit-btn");
        medkitBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            useMedkit();
        }, { passive: false });
        medkitBtn.addEventListener("click", () => {
            useMedkit();
        });
    }

    function updateJoystickPos(touch, base, stick, maxDist) {
        const rect = base.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        let dist = Math.hypot(dx, dy);

        if (dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }

        stick.style.transform = `translate(${dx}px, ${dy}px)`;
        joystickVector = { x: dx / maxDist, y: dy / maxDist };
        joystickActive = true;
    }

    function resetJoystick(stick) {
        stick.style.transform = `translate(0px, 0px)`;
        joystickVector = { x: 0, y: 0 };
        joystickActive = false;
        joystickTouchId = null;
    }

    function manualShoot() {
        let closestBot = null;
        let minDist = Infinity;

        bots.forEach(bot => {
            if (bot.alive) {
                let dist = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestBot = bot;
                }
            }
        });

        let angle = closestBot ? Math.atan2(closestBot.y - player.y, closestBot.x - player.x) : 0;
        bullets.push({
            x: player.x, y: player.y,
            dx: Math.cos(angle) * 12, dy: Math.sin(angle) * 12,
            radius: 6, isPlayer: true
        });
    }

    function useMedkit() {
        if (medkits > 0 && playerHp < 100) {
            medkits--;
            playerHp = Math.min(100, playerHp + 40);
            document.getElementById("player-hp").innerText = playerHp;
            document.getElementById("medkit-count").innerText = medkits;
        }
    }

    function update() {
        if (!gameRunning) return;

        if (joystickActive && (joystickVector.x !== 0 || joystickVector.y !== 0)) {
            let nextX = player.x + joystickVector.x * player.speed;
            let nextY = player.y + joystickVector.y * player.speed;

            nextX = Math.max(player.radius, Math.min(mapWidth - player.radius, nextX));
            nextY = Math.max(player.radius, Math.min(mapHeight - player.radius, nextY));

            let collide = false;
            structures.forEach(s => {
                if (nextX > s.x - player.radius && nextX < s.x + s.width + player.radius &&
                    nextY > s.y - player.radius && nextY < s.y + s.height + player.radius) {
                    collide = true;
                }
            });

            if (!collide) {
                player.x = nextX;
                player.y = nextY;
            }
        }

        let aliveBotsCount = 0;
        bots.forEach(bot => {
            if (bot.alive) {
                aliveBotsCount++;
                let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
                let nextBotX = bot.x + Math.cos(angle) * botSpeed;
                let nextBotY = bot.y + Math.sin(angle) * botSpeed;

                if (Math.hypot(player.x - bot.x, player.y - bot.y) < player.radius + bot.radius) {
                    playerHp -= 0.5;
                    document.getElementById("player-hp").innerText = Math.max(0, Math.floor(playerHp));
                    if (playerHp <= 0) {
                        gameRunning = false;
                        alert("¡Has sido eliminado!");
                        location.reload();
                    }
                }

                let botCollide = false;
                structures.forEach(s => {
                    if (nextBotX > s.x - bot.radius && nextBotX < s.x + s.width + bot.radius &&
                        nextBotY > s.y - bot.radius && nextBotY < s.y + s.height + bot.radius) {
                        botCollide = true;
