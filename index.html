<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COUNTRYBALLS WAR ONLINE - VM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }

  #lobbyScreen {
    position: absolute; inset: 0; z-index: 100;
    background: radial-gradient(circle, #1d3557 0%, #0b132b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  .brand-logo {
    font-size: 2rem; font-weight: 900;
    background: linear-gradient(135deg, #ff0055, #ffcc00, #00ffcc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: 2px; margin-bottom: 5px;
  }

  .slither-title {
    font-size: 2.2rem; font-weight: 900; color: #fff;
    text-shadow: 0 4px 0 #000, 0 0 15px rgba(255,255,255,0.3);
    letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase;
  }

  .avatar-container {
    position: relative; width: 120px; height: 120px; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
  }

  .avatar-preview {
    width: 110px; height: 110px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    background-color: #e63946; position: relative;
  }

  .input-nick {
    width: 240px; padding: 12px; border-radius: 25px; border: 3px solid #4cc9f0;
    background: rgba(0,0,0,0.6); color: #fff; text-align: center;
    font-size: 1.1rem; font-weight: bold; outline: none; margin-bottom: 15px;
  }

  .btn-play {
    width: 220px; padding: 14px; border-radius: 30px; border: none;
    background: linear-gradient(135deg, #2ec4b6, #0f9f90);
    color: #fff; font-size: 1.2rem; font-weight: 900; cursor: pointer;
    box-shadow: 0 5px 0 #0a665c, 0 8px 15px rgba(0,0,0,0.4);
    margin-bottom: 12px;
  }
  .btn-play:active { transform: translateY(3px); box-shadow: 0 2px 0 #0a665c; }

  .btn-skin {
    padding: 10px 20px; border-radius: 20px; border: 2px solid #fff;
    background: rgba(255,255,255,0.15); color: #fff; font-weight: bold; cursor: pointer;
  }

  #gameHUD {
    position: absolute; top: 15px; left: 15px; z-index: 50; display: none;
    color: #fff; font-weight: bold; font-size: 1.1rem; text-shadow: 0 2px 4px #000;
  }
  .health-bar {
    width: 200px; height: 22px; background: rgba(0,0,0,0.6);
    border: 2px solid #fff; border-radius: 11px; overflow: hidden; margin-top: 5px; position: relative;
  }
  .health-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.1s; }
  .health-text {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; color: #fff; font-weight: 900;
  }

  .ammo-display { margin-top: 6px; font-size: 1rem; color: #f59e0b; font-weight: 900; }

  #joystickZone {
    position: absolute; bottom: 25px; left: 25px; z-index: 50; display: none;
    width: 120px; height: 120px; background: rgba(255,255,255,0.15);
    border: 2px dashed rgba(255,255,255,0.5); border-radius: 50%;
    align-items: center; justify-content: center; touch-action: none;
  }
  #joystickKnob {
    width: 50px; height: 50px; background: rgba(255,255,255,0.8);
    border-radius: 50%; border: 2px solid #fff; pointer-events: none;
  }

  #gameControls {
    position: absolute; bottom: 25px; right: 20px; z-index: 50;
    display: none; gap: 12px; flex-direction: row; touch-action: none;
  }

  .control-btn {
    width: 65px; height: 65px; border-radius: 50%; border: 3px solid #fff;
    background: rgba(0,0,0,0.5); color: #fff; font-weight: 900; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; touch-action: none;
  }
  .btn-shoot { background: rgba(239, 68, 68, 0.9); }
  .btn-build { background: rgba(59, 130, 246, 0.9); }
  .btn-heal { background: rgba(34, 197, 94, 0.9); }
  .control-btn:active { transform: scale(0.9); }

  #gameCanvas { width: 100%; height: 100%; display: block; background: #0b132b; }
</style>
</head>
<body>

  <div id="lobbyScreen">
    <div class="brand-logo">VM STUDIOS</div>
    <div class="slither-title">Countryballs War</div>
    
    <div class="avatar-container">
      <div id="avatarPreview" class="avatar-preview"></div>
    </div>
    
    <input type="text" id="nickInput" class="input-nick" value="Player 1" maxlength="12">
    
    <button class="btn-play" id="btnPlayGame">PLAY GAME</button>
    <button class="btn-skin" id="btnChangeSkin">Cambiar Ball</button>
  </div>

  <div id="gameHUD">
    <div id="levelDisplay">Nivel: 1</div>
    <div class="health-bar">
      <div id="healthFill" class="health-fill"></div>
      <div id="healthText" class="health-text">100 / 100 HP</div>
    </div>
    <div id="ammoDisplay" class="ammo-display">Munición: 30 / 30</div>
  </div>

  <div id="joystickZone">
    <div id="joystickKnob"></div>
  </div>

  <div id="gameControls">
    <div class="control-btn btn-heal" id="btnHeal">CURAR</div>
    <div class="control-btn btn-build" id="btnBuild">MURO</div>
    <div class="control-btn btn-shoot" id="btnShoot">FUEGO</div>
  </div>

  <canvas id="gameCanvas"></canvas>

<script>
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(freq, duration, type='sine') {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  const skins = [
    { name: 'Argentina', color1: '#75aadb', color2: '#fff', stripe: 'horizontal' },
    { name: 'Brasil', color1: '#009739', color2: '#fedd00', stripe: 'diamond' },
    { name: 'México', color1: '#006341', color2: '#ce1126', stripe: 'vertical' },
    { name: 'España', color1: '#aa151b', color2: '#f1bf00', stripe: 'horizontal' },
    { name: 'USA', color1: '#3c3b6e', color2: '#b22234', stripe: 'vertical' },
    { name: 'Alemania', color1: '#000', color2: '#dd0000', stripe: 'horizontal' }
  ];
  let skinIdx = 0;

  const avatarPreview = document.getElementById('avatarPreview');
  function updateAvatar() {
    let s = skins[skinIdx];
    avatarPreview.style.background = `linear-gradient(135deg, ${s.color1}, ${s.color2})`;
  }
  
  function nextSkin() {
    initAudio();
    playSound(450, 0.1);
    skinIdx = (skinIdx + 1) % skins.length;
    updateAvatar();
  }

  document.getElementById('btnChangeSkin').addEventListener('click', nextSkin);
  updateAvatar();

  let canvas, ctx;
  let inGame = false;
  let gameLevel = 1;
  let player = { 
    x: 0, y: 0, radius: 32, hp: 100, maxHp: 100, 
    ammo: 30, maxAmmo: 30, isReloading: false,
    skin: skins[0], angle: 0 
  };
  let joystick = { active: false, dx: 0, dy: 0, touchId: null };
  let isShooting = false;
  let shootTouchId = null;
  let lastShootTime = 0;

  let foodList = [];
  let botBalls = [];
  let bullets = [];
  let structures = [];
  let particles = [];

  const btnPlay = document.getElementById('btnPlayGame');
  btnPlay.addEventListener('click', enterGame);
  btnPlay.addEventListener('touchend', (e) => {
    e.preventDefault();
    enterGame();
  });

  function enterGame() {
    initAudio();
    playSound(450, 0.1);
    document.getElementById('lobbyScreen').style.display = 'none';
    document.getElementById('gameControls').style.display = 'flex';
    document.getElementById('joystickZone').style.display = 'flex';
    document.getElementById('gameHUD').style.display = 'block';
    
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    player.skin = skins[skinIdx];
    player.x = 0; player.y = 0; player.hp = 100; player.ammo = 30; player.isReloading = false;
    gameLevel = 1;

    spawnFood();
    spawnInitialStructures();
    spawnBots();

    setupControls();

    inGame = true;
    requestAnimationFrame(loop);
  }

  function setupControls() {
    const jZone = document.getElementById('joystickZone');
    const jKnob = document.getElementById('joystickKnob');
    const btnShoot = document.getElementById('btnShoot');

    btnShoot.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for(let t of e.changedTouches) {
        shootTouchId = t.identifier;
        isShooting = true;
      }
    }, {passive: false});

    btnShoot.addEventListener('touchend', (e) => {
      e.preventDefault();
      for(let t of e.changedTouches) {
        if(t.identifier === shootTouchId) {
          isShooting = false;
          shootTouchId = null;
        }
      }
    }, {passive: false});

    btnShoot.addEventListener('mousedown', () => { isShooting = true; });
    window.addEventListener('mouseup', () => { isShooting = false; });

    document.getElementById('btnHeal').addEventListener('touchstart', (e) => { e.preventDefault(); healPlayer(); }, {passive: false});
    document.getElementById('btnHeal').addEventListener('click', healPlayer);

    document.getElementById('btnBuild').addEventListener('touchstart', (e) => { e.preventDefault(); buildStructure(); }, {passive: false});
    document.getElementById('btnBuild').addEventListener('click', buildStructure);

    jZone.addEventListener('touchstart', e => {
      e.preventDefault();
      let t = e.changedTouches[0];
      joystick.active = true;
      joystick.touchId = t.identifier;
      updateJoystick(t);
    }, {passive: false});

    window.addEventListener('touchmove', e => {
      if(!joystick.active) return;
      for(let t of e.touches) {
        if(t.identifier === joystick.touchId) updateJoystick(t);
      }
    }, {passive: false});

    const resetJoystick = (e) => {
      for(let t of e.changedTouches) {
        if(t.identifier === joystick.touchId) {
          joystick.active = false;
          joystick.dx = 0; joystick.dy = 0;
          joystick.touchId = null;
          jKnob.style.transform = `translate(0px, 0px)`;
        }
      }
    };

    window.addEventListener('touchend', resetJoystick);
    window.addEventListener('touchcancel', resetJoystick);

    function updateJoystick(t) {
      let rect = jZone.getBoundingClientRect();
      let centerX = rect.left + rect.width/2;
      let centerY = rect.top + rect.height/2;
      let dx = t.clientX - centerX;
      let dy = t.clientY - centerY;
      let dist = Math.hypot(dx, dy);
      let maxDist = rect.width/2;

      if(dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      jKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joystick.dx = dx / maxDist;
      joystick.dy = dy / maxDist;
    }
  }

  function spawnFood() {
    foodList = [];
    for(let i = 0; i < 200; i++) {
      foodList.push({
        x: (Math.random() - 0.5) * 3500,
        y: (Math.random() - 0.5) * 3500,
        r: 6 + Math.random() * 4,
        color: `hsl(${Math.random()*360}, 90%, 65%)`
      });
    }
  }

  function spawnInitialStructures() {
    structures = [];
    for(let i = 0; i < 30; i++) {
      structures.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        size: 50
      });
    }
  }

  function spawnBots() {
    let count = 4 + gameLevel * 3;
    botBalls = [];
    for(let i = 0; i < count; i++) {
      let randomSkin = skins[Math.floor(Math.random() * skins.length)];
      botBalls.push({
        x: (Math.random() - 0.5) * 3000,
        y: (Math.random() - 0.5) * 3000,
        radius: 28 + Math.random() * 8,
        hp: 40 + gameLevel * 10,
        maxHp: 40 + gameLevel * 10,
        skin: randomSkin,
        angle: 0,
        lastShoot: Date.now() + Math.random() * 2000
      });
    }
  }

  function healPlayer() {
    if(!inGame) return;
    if(player.hp < player.maxHp) {
      playSound(600, 0.2);
      player.hp = Math.min(player.maxHp, player.hp + 30);
      createExplosion(player.x, player.y, '#22c55e');
    }
  }

  function reloadAmmo() {
    if(player.isReloading) return;
    player.isReloading = true;
    playSound(200, 0.3, 'triangle');
    setTimeout(() => {
      player.ammo = player.maxAmmo;
      player.isReloading = false;
      playSound(800, 0.1, 'sine');
    }, 2000);
  }

  function createExplosion(x, y, color) {
    playSound(150, 0.2, 'sawtooth');
    for(let i = 0; i < 15; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 10,
        vy: (Math.random() - 0.5) * 10,
        r: Math.random() * 5 + 2,
        color: color || '#ff5500',
        life: 25
      });
    }
  }

  function processContinuousShooting() {
    let now = Date.now();
    if(isShooting && now - lastShootTime > 180) {
      if(player.isReloading) return;

      if(player.ammo <= 0) {
        reloadAmmo();
        return;
      }

      lastShootTime = now;
      player.ammo--;
      playSound(300, 0.08, 'square');
      
      let targetAngle = player.angle;
      let closestBot = null;
      let minDist = 500;

      botBalls.forEach(bot => {
        let d = Math.hypot(bot.x - player.x, bot.y - player.y);
        if(d < minDist) { minDist = d; closestBot = bot; }
      });

      if(closestBot) {
        targetAngle = Math.atan2(closestBot.y - player.y, closestBot.x - player.x);
      }

      bullets.push({
        x: player.x + Math.cos(targetAngle) * (player.radius + 10),
        y: player.y + Math.sin(targetAngle) * (player.radius + 10),
        vx: Math.cos(targetAngle) * 15,
        vy: Math.sin(targetAngle) * 15,
        isEnemy: false,
        life: 70
      });
    }
  }

  function buildStructure() {
    if(!inGame) return;
    playSound(200, 0.1);
    structures.push({
      x: player.x + Math.cos(player.angle) * (player.radius + 40),
      y: player.y + Math.sin(player.angle) * (player.radius + 40),
      size: 45
    });
  }

  function drawCountryball(x, y, radius, skin, angle, hp, maxHp) {
    ctx.save();
    ctx.translate(x, y);

    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = skin.color1;
    ctx.fillRect(-radius, -radius, radius * 2, radius * 2);

    ctx.fillStyle = skin.color2;
    if(skin.stripe === 'horizontal') {
      ctx.fillRect(-radius, 0, radius * 2, radius);
    } else if(skin.stripe === 'vertical') {
      ctx.fillRect(0, -radius, radius, radius * 2);
    } else if(skin.stripe === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.7);
      ctx.lineTo(radius * 0.7, 0);
      ctx.lineTo(0, radius * 0.7);
      ctx.lineTo(-radius * 0.7, 0);
      ctx.fill();
    }

    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();

    let eyeOffsetX = Math.cos(angle) * (radius * 0.3);
    let eyeOffsetY = Math.sin(angle) * (radius * 0.3);

    ctx.beginPath();
    ctx.ellipse(eyeOffsetX - radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(eyeOffsetX + radius*0.2, eyeOffsetY - radius*0.05, radius*0.22, radius*0.28, angle, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.stroke();

    if(hp !== undefined && maxHp !== undefined) {
      let barW = radius * 1.6;
      let barH = 5;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-barW/2, -radius - 12, barW, barH);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(-barW/2, -radius - 12, barW * (hp / maxHp), barH);
    }

    ctx.restore();
  }

  function loop() {
    if(!inGame) return;

    if(joystick.active) {
      player.x += joystick.dx * 5;
      player.y += joystick.dy * 5;
      player.angle = Math.atan2(joystick.dy, joystick.dx);
    }

    processContinuousShooting();

    for(let i = foodList.length - 1; i >= 0; i--) {
      let f = foodList[i];
      if(Math.hypot(f.x - player.x, f.y - player.y) < player.radius) {
        player.hp = Math.min(player.maxHp, player.hp + 1);
        foodList.splice(i, 1);
      }
    }

    let now = Date.now();
    for(let bIdx = botBalls.length - 1; bIdx >= 0; bIdx--) {
      let bot = botBalls[bIdx];
      let bDist = Math.hypot(player.x - bot.x, player.y - bot.y);
      bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);

      if(bDist > 120) {
        bot.x += Math.cos(bot.angle) * (2 + gameLevel * 0.2);
        bot.y += Math.sin(bot.angle) * (2 + gameLevel * 0.2);
      }

      if(bDist < 550 && now - bot.lastShoot > Math.max(700, 2200 - gameLevel * 150)) {
        bot.lastShoot = now;
        bullets.push({
          x: bot.x + Math.cos(bot.angle) * (bot.radius + 5),
          y: bot.y + Math.sin(bot.angle) * (bot.radius + 5),
          vx: Math.cos(bot.angle) * 8,
          vy: Math.sin(bot.angle) * 8,
          isEnemy: true,
          life: 80
        });
      }
    }

    for(let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;

      let hitWall = false;
      structures.forEach(st => {
        if(Math.abs(b.x - st.x) < st.size/2 && Math.abs(b.y - st.y) < st.size/2) hitWall = true;
      });

      if(hitWall || b.life <= 0) {
        bullets.splice(i, 1);
        continue;
      }

      if(b.isEnemy && Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
        player.hp -= 8;
        createExplosion(player.x, player.y, '#ef4444');
        bullets.splice(i, 1);
        if(player.hp <= 0) {
          alert('¡Has sido eliminado!');
          location.reload();
        }
        continue;
      }

      if(!b.isEnemy) {
        for(let bIdx = botBalls.length - 1; bIdx >= 0; bIdx--) {
          let bot = botBalls[bIdx];
          if(Math.hypot(b.x - bot.x, b.y - bot.y) < bot.radius) {
            bot.hp -= 15;
            createExplosion(bot.x, bot.y, '#ffcc00');
            bullets.splice(i, 1);
            
            if(bot.hp <= 0) {
              createExplosion(bot.x, bot.y, '#ff0055');
              botBalls.splice(bIdx, 1);
            }
            break;
          }
        }
      }
    }

    if(botBalls.length === 0) {
      gameLevel++;
      document.getElementById('levelDisplay').innerText = `Nivel: ${gameLevel}`;
      spawnFood();
      spawnBots();
    }

    for(let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if(p.life <= 0) particles.splice(i, 1);
    }

    document.getElementById('healthFill').style.width = `${Math.max(0, (player.hp / player.maxHp)*100)}%`;
    document.getElementById('healthText').innerText = `${Math.max(0, Math.floor(player.hp))} / ${player.maxHp} HP`;
    
    if(player.isReloading) {
      document.getElementById('ammoDisplay').innerText = `RECARGANDO...`;
    } else {
      document.getElementById('ammoDisplay').innerText = `Munición: ${player.ammo} / ${player.maxAmmo}`;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
    let gridOffsetX = (-player.x + canvas.width/2) % 60;
    let gridOffsetY = (-player.y + canvas.height/2) % 60;
    for (let x = gridOffsetX;
